<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gráfico de Cortes de Listones</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />

    <style>
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>

    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>
    <script type="text/javascript">
      google.charts.load("current", { packages: ["corechart"] });

      const MAX_CUT_300 = 300;
      const MAX_CUT_420 = 420;

      function getCorteValues(prefix) {
        return Array.from({ length: 5 }, (_, i) => {
          const value = parseInt(
            document.getElementById(`${prefix}_${i + 1}`).value
          );
          return isNaN(value) ? 0 : value;
        });
      }

      function validateCuts() {
        const cuts300 = getCorteValues("corte300");
        const cuts420 = getCorteValues("corte420");

        for (let i = 0; i < cuts300.length; i++) {
          if (cuts300[i] > MAX_CUT_300) {
            alert(
              `El corte ${
                i + 1
              } para el listón de 300 metros supera el límite de ${MAX_CUT_300} metros.`
            );
            return false;
          }
        }

        for (let i = 0; i < cuts420.length; i++) {
          if (cuts420[i] > MAX_CUT_420) {
            alert(
              `El corte ${
                i + 1
              } para el listón de 420 metros supera el límite de ${MAX_CUT_420} metros.`
            );
            return false;
          }
        }

        return true;
      }

      function drawChart() {
        if (!validateCuts()) return;

        const cortes300 = getCorteValues("corte300");
        const cortes420 = getCorteValues("corte420");

        const data = google.visualization.arrayToDataTable([
          ["Listones", "Corte 1", "Corte 2", "Corte 3", "Corte 4", "Corte 5"],
          ["300 metros", ...cortes300],
          ["420 metros", ...cortes420],
        ]);

        const options = {
          width: "100%",
          height: 400,
          legend: { position: "top", maxLines: 3 },
          bar: { groupWidth: "75%" },
          isStacked: true,
          colors: ["#FF5733", "#33FF57", "#3357FF", "#F39C12", "#8E44AD"],
        };

        const chart = new google.visualization.ColumnChart(
          document.getElementById("chart_div")
        );
        chart.draw(data, options);
      }
    </script>
  </head>
  <body>
    <div class="container mt-5">
      <h2 class="text-center mb-4">Gráfico de Cortes de Listones</h2>

      <div class="row">
        <div class="col-md-6">
          <h5>Listón de 300 metros</h5>
          <input
            id="corte300_1"
            type="number"
            class="form-control mb-2"
            value="100"
          />
          <input
            id="corte300_2"
            type="number"
            class="form-control mb-2"
            value="50"
          />
          <input
            id="corte300_3"
            type="number"
            class="form-control mb-2"
            value="150"
          />
          <input
            id="corte300_4"
            type="number"
            class="form-control mb-2"
            value="75"
          />
          <input
            id="corte300_5"
            type="number"
            class="form-control mb-2"
            value="30"
          />
        </div>

        <div class="col-md-6">
          <h5>Listón de 420 metros</h5>
          <input
            id="corte420_1"
            type="number"
            class="form-control mb-2"
            value="120"
          />
          <input
            id="corte420_2"
            type="number"
            class="form-control mb-2"
            value="180"
          />
          <input
            id="corte420_3"
            type="number"
            class="form-control mb-2"
            value="120"
          />
          <input
            id="corte420_4"
            type="number"
            class="form-control mb-2"
            value="50"
          />
          <input
            id="corte420_5"
            type="number"
            class="form-control mb-2"
            value="90"
          />
        </div>
      </div>

      <div class="text-center mt-4">
        <button onclick="drawChart()" class="btn btn-primary">
          Generar Gráfico
        </button>
      </div>

      <div id="chart_div" class="border rounded p-3 bg-light mt-4"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
